name: Reach TACPAD material converter
on:
  push:
    branches: [reach-combat]
    paths:
      - 'tools/reach/assets/build_appearance.py'
      - 'tools/reach/assets/test_appearance.py'
      - 'tools/reach/assets/Build-Reach-appearance.cmd'
      - 'tools/reach/assets/APPEARANCE.txt'
      - '.github/workflows/reach-appearance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check converter math and build standalone Windows tool
        shell: pwsh
        run: |
          New-Item -ItemType Directory build -Force | Out-Null
          function Check-Step([string]$label) {
            if ($LASTEXITCODE -ne 0) {
              Get-Content build/appearance-step.log | Select-Object -Last 16 | ForEach-Object { Write-Host "::error title=${label}::$_" }
              exit 1
            }
          }
          python -m pip install -r tools/reach/assets/requirements.txt pyinstaller==6.16.0 2>&1 | Tee-Object build/appearance-step.log
          Check-Step 'Dependencies'
          python tools/reach/assets/test_appearance.py 2>&1 | Tee-Object build/appearance-step.log
          Check-Step 'Appearance tests'
          python -m PyInstaller --noconfirm --clean --onefile --console --name ReachArAppearance --paths tools/reach/assets --distpath build/reach-appearance --workpath build/appearance-work --specpath build tools/reach/assets/build_appearance.py 2>&1 | Tee-Object build/appearance-step.log
          Check-Step 'Appearance packaging'
          & build/reach-appearance/ReachArAppearance.exe --help 2>&1 | Tee-Object build/appearance-step.log
          Check-Step 'Appearance runtime'
          Copy-Item tools/reach/assets/Build-Reach-appearance.cmd, tools/reach/assets/APPEARANCE.txt build/reach-appearance/
          New-Item -ItemType Directory build/reach-appearance/licenses -Force | Out-Null
          Copy-Item tools/reach/assets/rmf_reader/LICENSE build/reach-appearance/licenses/Reclaimer.txt
          Copy-Item tools/reach/assets/rmf_reader/UPSTREAM.md build/reach-appearance/licenses/Reclaimer-source.md
          Copy-Item COPYING.txt build/reach-appearance/licenses/Project-GPL.txt
          New-Item -ItemType Directory build/reach-appearance/source -Force | Out-Null
          Copy-Item tools/reach/assets/*.py, tools/reach/assets/requirements.txt build/reach-appearance/source/
          Copy-Item -Recurse tools/reach/assets/rmf_reader build/reach-appearance/source/
          python tools/reach/assets/copy_licenses.py build/reach-appearance/licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: reach-appearance-tools
          path: build/reach-appearance/
          if-no-files-found: error
