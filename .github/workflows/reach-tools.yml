name: Reach combat collection tools

on:
  push:
    branches: [reach-combat]
    paths:
      - '.github/workflows/reach-tools.yml'
      - 'tools/reach/Collect-*.cmd'
      - 'tools/reach/collect-*.ps1'
      - 'tools/reach/test-*.ps1'
      - 'tools/reach/start-playtest.ps1'
      - 'tools/reach/Start-*.cmd'
      - 'tools/reach/Fix-*.cmd'
      - 'tools/reach/fix-*.ps1'
      - 'tools/reach/reach_prototype.cfg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools-check:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell inventory helper
        shell: powershell
        run: ./tools/reach/test-install-info.ps1
      - name: Check resource text collection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./tools/reach/test-combat-data.ps1
          } catch {
            $detail = $_.ToString() + ' ' + $_.InvocationInfo.PositionMessage
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Resource collector test::$detail"
            exit 1
          }
      - name: Check isolated playtest preparation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./tools/reach/test-playtest.ps1
          } catch {
            $detail = $_.ToString() + ' ' + $_.InvocationInfo.PositionMessage
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Playtest preparation test::$detail"
            exit 1
          }
      - name: Check converted rifle staging
        shell: powershell
        run: |
          try { & ./tools/reach/test-rifle-launch.ps1 }
          catch {
            Write-Host "::error title=Rifle staging::$($_.Exception.Message)"
            exit 1
          }
      - name: Upload double-click collection helpers
        # Kept separate from the private generated weapon pack.
        uses: actions/upload-artifact@v4
        with:
          name: reach-collection-tools
          path: |
            tools/reach/Collect-install-info.cmd
            tools/reach/collect-install-info.ps1
            tools/reach/Collect-combat-data.cmd
            tools/reach/collect-combat-data.ps1
      - name: Check existing rifle script repair
        shell: powershell
        run: ./tools/reach/test-rifle-script-fix.ps1
      - name: Upload rifle script fix
        uses: actions/upload-artifact@v4
        with:
          name: reach-rifle-script-fix
          path: |
            tools/reach/Fix-Reach-rifle-script.cmd
            tools/reach/fix-rifle-script.ps1
