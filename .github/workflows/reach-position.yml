name: Reach rifle pose overlay

on:
  push:
    branches: [reach-combat]
    paths:
      - 'tools/reach/position/**'
      - '.github/workflows/reach-position.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package automatic position preset
        shell: pwsh
        run: |
          python tools/reach/position/build_preset.py build/Reach-rifle-preset-r11.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify both Windows CMD launchers load the installed preset
        shell: powershell
        run: ./tools/reach/position/test-preset-launch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: reach-rifle-preset-r11
          path: build/Reach-rifle-preset-r11.zip
          if-no-files-found: error
