name: Reach rifle pose overlay

on:
  push:
    branches: [reach-combat]
    paths:
      - 'tools/reach/position/**'
      - '.github/workflows/reach-position.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check counter pivot, script API and retained weapon logic
        shell: pwsh
        run: |
          python tools/reach/position/test_pose.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package rifle-only rotation update
        shell: pwsh
        run: |
          python tools/reach/position/build_pose.py build/Reach-rifle-pose-r10.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: reach-rifle-pose-r10
          path: build/Reach-rifle-pose-r10.zip
          if-no-files-found: error
