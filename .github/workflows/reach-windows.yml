name: Reach combat Windows build

on:
  push:
    branches: [reach-combat]
    paths:
      - 'neo/**'
      - 'doomclassic/**'
      - '.github/workflows/reach-windows.yml'
      - 'tools/reach/build-windows.ps1'
      - 'tools/reach/prepare-directx.ps1'
      - 'tools/reach/modern-msvc.props'
      - 'tools/reach/test-sprint.cpp'
      - 'tools/reach/test-actions.cpp'
      - 'tools/reach/start-playtest.ps1'
      - 'tools/reach/Start-Reach-playtest.cmd'
      - 'tools/reach/reach-prototype.cfg'
      - 'tools/reach/PLAYTEST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check combat action rules
        run: |
          g++ -std=c++98 -Wall -Wextra -Werror tools/reach/test-sprint.cpp -o /tmp/reach-sprint-test
          /tmp/reach-sprint-test
          g++ -std=c++98 -Wall -Wextra -Werror tools/reach/test-actions.cpp -o /tmp/reach-actions-test
          /tmp/reach-actions-test
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86
      - name: Prepare verified DirectX June 2010 SDK
        shell: pwsh
        run: ./tools/reach/prepare-directx.ps1
      - name: Build Win32 Release
        shell: pwsh
        run: ./tools/reach/build-windows.ps1 -Toolset v143
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reach-build-diagnostics
          path: |
            build/reach-build.log
            build/reach-build.binlog
          if-no-files-found: warn
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: reach-bfg-win32
          path: build/reach-playtest/
          if-no-files-found: error
